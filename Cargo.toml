[package]
name = "wa-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
qrcode = "0.14.1"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "sqlite", "postgres", "chrono"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "process", "fs"] }
whatsapp-rust = { version = "0.7.0", default-features = false, features = [
    "sqlite-storage",
    "tokio-runtime",
    "tokio-transport",
    "ureq-client"
] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
mimalloc = { version = "0.1", default-features = false }
img-parts = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
uuid = { version = "1", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
